name: Build YPN Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle :app:assembleDebug

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ypn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK to the direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ypn-browser.apk
          gh release upload build-latest ypn-browser.apk --clobber || \
          gh release create build-latest ypn-browser.apk \
            --title "YPN Browser — latest build" \
            --notes "Auto-published debug APK from the newest commit on main. Direct download: https://github.com/sufii429/ypn-browser/releases/download/build-latest/ypn-browser.apk"
            
